<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Sonuç Girişi / Result Entry</title>
  <link rel="stylesheet" href="style.css?v=20260610-1" />
  <style>
    /* ── Admin-specific styles ─────────────────────────────────────── */
    .adm-wrap        { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }

    .adm-login-box   { max-width: 360px; margin: 6rem auto; background: var(--card-bg, #1a1a2e);
                       border: 1px solid #333; border-radius: 12px; padding: 2rem; }
    .adm-login-box h2{ text-align:center; margin: 0 0 1.5rem; font-size:1.2rem; }
    .adm-login-box label { display:block; margin-bottom:1rem; font-size:.85rem; color:#aaa; }
    .adm-login-box input { display:block; width:100%; margin-top:.3rem; padding:.55rem .75rem;
                           background:#111; border:1px solid #444; border-radius:6px;
                           color:#fff; font-size:.95rem; box-sizing:border-box; }
    .adm-login-box input:focus { outline:none; border-color:#6c8ebf; }
    .adm-err        { color:#e74c3c; font-size:.82rem; margin:.4rem 0 .8rem; min-height:1.1em; }
    .adm-login-btn  { width:100%; padding:.65rem; background:#2980b9; border:none;
                      border-radius:6px; color:#fff; font-size:1rem; cursor:pointer; }
    .adm-login-btn:hover { background:#3498db; }

    .adm-header     { display:flex; align-items:center; justify-content:space-between;
                      margin-bottom:1.5rem; flex-wrap:wrap; gap:.75rem; }
    .adm-header h1  { font-size:1.2rem; margin:0; }
    .adm-header-right{ display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; }
    .adm-user-badge { font-size:.82rem; background:#1e3a5f; border:1px solid #2980b9;
                      border-radius:20px; padding:.3rem .85rem; color:#7bb3e0; }
    .adm-logout-btn { font-size:.82rem; background:transparent; border:1px solid #555;
                      border-radius:6px; color:#aaa; padding:.3rem .7rem; cursor:pointer; }
    .adm-logout-btn:hover { border-color:#aaa; color:#fff; }

    .adm-filters    { display:flex; gap:.5rem; margin-bottom:1.25rem; flex-wrap:wrap; }
    .adm-filter-btn { padding:.4rem 1rem; border-radius:20px; border:1px solid #444;
                      background:transparent; color:#aaa; cursor:pointer; font-size:.82rem; }
    .adm-filter-btn.active { background:#2980b9; border-color:#2980b9; color:#fff; }
    .adm-filter-btn:hover:not(.active) { border-color:#aaa; color:#fff; }

    .adm-count      { font-size:.8rem; color:#888; margin-bottom:.75rem; }

    /* ── Match card ───────────────────────────────────────────────── */
    .adm-card       { background:#111827; border:1px solid #2a2a3e; border-radius:10px;
                      margin-bottom:.75rem; overflow:hidden; }
    .adm-card-head  { display:flex; align-items:center; justify-content:space-between;
                      padding:.7rem 1rem; gap:.5rem; flex-wrap:wrap; }
    .adm-match-id   { font-size:.72rem; color:#555; font-family:monospace; }
    .adm-match-date { font-size:.78rem; color:#888; }
    .adm-match-teams{ font-size:1rem; font-weight:600; color:#e0e0e0; }
    .adm-status-dot { display:inline-block; width:8px; height:8px; border-radius:50%;
                      margin-right:.4rem; vertical-align:middle; }
    .adm-status-dot.upcoming { background:#888; }
    .adm-status-dot.live     { background:#2ecc71; box-shadow:0 0 6px #2ecc71; animation:pulse 1.2s infinite; }
    .adm-status-dot.finished { background:#3498db; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .adm-card-body  { padding:.75rem 1rem 1rem; border-top:1px solid #1e2030; }
    .adm-existing   { font-size:.8rem; color:#7ec8a0; margin-bottom:.6rem; min-height:1.2em; }

    .adm-form-row   { display:grid; grid-template-columns: 1fr 1fr; gap:.6rem 1rem; margin-bottom:.75rem; }
    @media(max-width:500px){ .adm-form-row { grid-template-columns:1fr; } }

    .adm-field      { display:flex; flex-direction:column; gap:.25rem; }
    .adm-field label{ font-size:.75rem; color:#888; text-transform:uppercase; letter-spacing:.04em; }
    .adm-field input{ padding:.45rem .65rem; background:#0d1117; border:1px solid #333;
                      border-radius:6px; color:#e0e0e0; font-size:.9rem; }
    .adm-field input:focus { outline:none; border-color:#2980b9; }
    .adm-field input.score-input { width:60px; text-align:center; }

    .adm-score-row  { display:flex; align-items:center; gap:.5rem; }
    .adm-score-sep  { color:#666; font-weight:700; font-size:1.1rem; }

    .adm-actions    { display:flex; gap:.6rem; flex-wrap:wrap; }
    .adm-save-btn   { padding:.45rem 1.1rem; background:#27ae60; border:none; border-radius:6px;
                      color:#fff; font-size:.85rem; cursor:pointer; font-weight:600; }
    .adm-save-btn:hover { background:#2ecc71; }
    .adm-save-btn:disabled { background:#1a5e35; color:#aaa; cursor:not-allowed; }
    .adm-fetch-btn  { padding:.45rem 1rem; background:#1e3a5f; border:1px solid #2980b9;
                      border-radius:6px; color:#7bb3e0; font-size:.85rem; cursor:pointer; }
    .adm-fetch-btn:hover { background:#2980b9; color:#fff; }
    .adm-fetch-btn:disabled { opacity:.4; cursor:not-allowed; }
    .adm-msg        { font-size:.78rem; margin-top:.35rem; min-height:1em; }
    .adm-msg.ok     { color:#2ecc71; }
    .adm-msg.err    { color:#e74c3c; }

    .adm-bonus-hint { font-size:.72rem; color:#666; margin-top:.15rem; }

    .adm-clear-btn  { padding:.45rem 1rem; background:transparent; border:1px solid #7f1d1d;
                      border-radius:6px; color:#f87171; font-size:.85rem; cursor:pointer; }
    .adm-clear-btn:hover { background:#7f1d1d; color:#fff; }
  </style>
</head>
<body>

<!-- ── Login screen (shown when not authenticated / not admin) ─────────── -->
<div id="adm-login-screen">
  <div class="adm-login-box">
    <h2>🔐 Admin Girişi</h2>
    <form id="adm-login-form" autocomplete="on">
      <label>
        Kullanıcı Adı
        <input type="text" id="adm-uname" autocomplete="username"
               placeholder="admin" required />
      </label>
      <label>
        Şifre
        <input type="password" id="adm-pw" autocomplete="current-password"
               placeholder="••••••" required />
      </label>
      <div id="adm-login-err" class="adm-err"></div>
      <button type="submit" class="adm-login-btn">Giriş Yap</button>
    </form>
  </div>
</div>

<!-- ── Main admin panel (hidden until logged in as admin) ─────────────── -->
<div id="adm-panel" class="adm-wrap hidden">

  <div class="adm-header">
    <div style="display:flex;align-items:center;gap:1rem">
      <img src="img/logo-la2026.png" alt="LaAlbiceleste 2026" style="height:88px;width:auto;border-radius:6px" />
      <div>
        <h1>⚙️ Sonuç Girişi &nbsp;<small style="color:#666;font-weight:400;font-size:.75rem">Admin Panel</small></h1>
        <div style="font-size:.78rem;color:#666;margin-top:.2rem">
          <a href="/groupstage.html" style="color:#2980b9">← Tahmin Sayfası</a>
        </div>
      </div>
    </div>
    <div class="adm-header-right">
      <span id="adm-user-badge" class="adm-user-badge"></span>
      <button id="adm-logout-btn" class="adm-logout-btn">Çıkış</button>
    </div>
  </div>

  <div class="adm-filters" id="adm-filters">
    <button class="adm-filter-btn active" data-filter="all">Tümü</button>
    <button class="adm-filter-btn" data-filter="live">🟢 Canlı</button>
    <button class="adm-filter-btn" data-filter="finished">✅ Bitti</button>
    <button class="adm-filter-btn" data-filter="upcoming">🕐 Yaklaşan</button>
    <button class="adm-filter-btn" data-filter="entered">📝 Girildi</button>
    <button class="adm-filter-btn" data-filter="missing">❌ Eksik</button>
  </div>

  <div id="adm-count" class="adm-count"></div>
  <div id="adm-matches"></div>
</div>

<script src="admin.js?v=20260610-1"></script>
</body>
</html>
