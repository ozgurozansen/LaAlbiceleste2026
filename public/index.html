<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaAlbiceleste2026</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;">
    <div>
      <img src="img/logo-la2026.png" alt="LaAlbiceleste 2026" style="width:112px;height:auto;margin-bottom:16px;" />
      <h1 style="margin:0 0 8px 0;font-size:24px;">LaAlbiceleste2026</h1>
      <p id="route-status" style="margin:0;color:#666;">Routing...</p>
    </div>
  </main>

  <script>
    (async function routeByStage() {
      var fallback = '/groupstage.html';
      var statusEl = document.getElementById('route-status');
      try {
        var res = await fetch('/api/stage/redirect-target');
        var json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Failed to resolve stage');
        var target = (json && typeof json.target === 'string' && json.target) ? json.target : fallback;
        window.location.replace(target);
      } catch (err) {
        if (statusEl) statusEl.textContent = 'Redirect failed, opening group stage...';
        window.location.replace(fallback);
      }
    })();
  </script>
</body>
</html>
